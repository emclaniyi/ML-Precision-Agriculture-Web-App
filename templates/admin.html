{% extends 'base.html' %}
{% block title %}Admin access | Smart Farm{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card">
  <aside class="auth-aside"><div class="eyebrow">Operations view</div><h1>Keep the farm intelligence organized.</h1><p>Use the admin workspace to review registered users and recommendation activity.</p></aside>
  <div class="auth-form"><div class="eyebrow">Restricted access</div><h2>Admin sign in</h2><form action="{{ url_for('adminlogin') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="username">Admin username</label><input id="username" name="username" required autocomplete="username"></div><div class="field"><label for="password">Admin password</label><input id="password" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary" type="submit">Open dashboard</button></form></div>
</div></section>
{% endblock %}
